# LiteLLM Proxy Configuration for Claude Code -> Google Gemini (Antigravity Models)
model_list:
  # Intercept Claude 3.7 Sonnet requests and route to Gemini 2.5 Pro
  - model_name: claude-3-7-sonnet-20250219
    litellm_params:
      model: gemini/gemini-2.5-pro
      api_key: os.environ/GEMINI_API_KEY

  # Intercept Claude 3.5 Sonnet requests and route to Gemini 2.5 Pro
  - model_name: claude-3-5-sonnet-20241022
    litellm_params:
      model: gemini/gemini-2.5-pro
      api_key: os.environ/GEMINI_API_KEY

  # Intercept Claude 3.5 Haiku requests and route to Gemini 2.5 Flash
  - model_name: claude-3-5-haiku-20241022
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY

  # Default fallback mapping for generic claude model queries
  - model_name: claude-3-sonnet-20240229
    litellm_params:
      model: gemini/gemini-2.5-pro
      api_key: os.environ/GEMINI_API_KEY

litellm_settings:
  drop_params: true
  set_verbose: false

router_settings:
  routing_strategy: simple-shuffle
