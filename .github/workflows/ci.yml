name: CI Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-scripts:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Validate Unix Shell Scripts
        if: runner.os != 'Windows'
        run: |
          bash -n setup.sh
          bash -n bin/claude-agy
          bash -n bin/claude-gemini
          bash -n bin/claude-continue
      - name: Validate Windows Batch Scripts
        if: runner.os == 'Windows'
        run: |
          if (-not (Test-Path .\setup.bat)) { throw "setup.bat missing" }
          if (-not (Test-Path .\bin\claude-agy.cmd)) { throw "claude-agy.cmd missing" }
          if (-not (Test-Path .\bin\claude-gemini.cmd)) { throw "claude-gemini.cmd missing" }
          if (-not (Test-Path .\bin\claude-continue.cmd)) { throw "claude-continue.cmd missing" }
